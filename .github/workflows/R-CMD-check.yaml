on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, roxygen2@8.0.0, Rcpp@1.1.2
          needs: check
      - name: Verify generated interfaces and documentation
        run: |
          stopifnot(packageVersion("roxygen2") == "8.0.0")
          stopifnot(packageVersion("Rcpp") == "1.1.2")
          Rcpp::compileAttributes()
          roxygen2::roxygenise()
        shell: Rscript {0}
      - name: Reject generated-file drift
        run: |
          git diff --exit-code -- DESCRIPTION NAMESPACE R/RcppExports.R src/RcppExports.cpp man
          test -z "$(git status --porcelain -- DESCRIPTION NAMESPACE R/RcppExports.R src/RcppExports.cpp man)"
        shell: bash
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
