name: Release package artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag, such as v0.1.1
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

# A main-branch push or publishing a draft must never start another build.
concurrency:
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify draft and freeze source commit
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Require an existing empty draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,assets > release.json
          python3 - <<'PYTHON'
          import json
          release = json.load(open("release.json"))
          if not release["isDraft"] or release["assets"]:
              raise SystemExit("Use an existing empty draft; published assets are never overwritten.")
          PYTHON
        shell: bash
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash
  binary:
    needs: [preflight, source]
    name: ${{ matrix.label }} (R ${{ matrix.r }}) binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - r: '4.6.1'
            r_series: '4.6'
            os: macos-15
            label: macOS Apple Silicon
            extension: tgz
            architecture: arm64
            package_type: mac.binary.sonoma-arm64
            macos_target: '14.0'
          - r: '4.5.3'
            r_series: '4.5'
            os: macos-15
            label: macOS Apple Silicon
            extension: tgz
            architecture: arm64
            package_type: mac.binary.big-sur-arm64
            macos_target: '11.0'
          - r: '4.4.3'
            r_series: '4.4'
            os: macos-15
            label: macOS Apple Silicon
            extension: tgz
            architecture: arm64
            package_type: mac.binary.big-sur-arm64
            macos_target: '11.0'
          - r: '4.6.1'
            r_series: '4.6'
            os: macos-15-intel
            label: macOS Intel
            extension: tgz
            architecture: x86_64
            package_type: mac.binary.big-sur-x86_64
            macos_target: '11.0'
          - r: '4.5.3'
            r_series: '4.5'
            os: macos-15-intel
            label: macOS Intel
            extension: tgz
            architecture: x86_64
            package_type: mac.binary.big-sur-x86_64
            macos_target: '11.0'
          - r: '4.4.3'
            r_series: '4.4'
            os: macos-15-intel
            label: macOS Intel
            extension: tgz
            architecture: x86_64
            package_type: mac.binary.big-sur-x86_64
            macos_target: '11.0'
          - r: '4.6.1'
            r_series: '4.6'
            os: windows-latest
            label: Windows x86-64
            extension: zip
            architecture: x86_64
            package_type: win.binary
          - r: '4.5.3'
            r_series: '4.5'
            os: windows-latest
            label: Windows x86-64
            extension: zip
            architecture: x86_64
            package_type: win.binary
          - r: '4.4.3'
            r_series: '4.4'
            os: windows-latest
            label: Windows x86-64
            extension: zip
            architecture: x86_64
            package_type: win.binary
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: always
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: source-bundle
      - name: Build binary package
        id: build
        env:
          ASSET_ARCHITECTURE: ${{ matrix.architecture }}
          ASSET_EXTENSION: ${{ matrix.extension }}
          ASSET_R_SERIES: ${{ matrix.r_series }}
          EXPECTED_PACKAGE_TYPE: ${{ matrix.package_type }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
          SOURCE_ASSET: source-bundle/${{ needs.source.outputs.asset }}
        run: |
          actual_architecture <- tolower(R.version$arch)
          expected_architecture <- Sys.getenv("ASSET_ARCHITECTURE")
          architecture_matches <- switch(
            expected_architecture,
            arm64 = grepl("arm64|aarch64", actual_architecture),
            x86_64 = identical(actual_architecture, "x86_64"),
            FALSE
          )
          if (!architecture_matches) {
            stop(
              "Runner architecture mismatch: expected ", expected_architecture,
              ", found ", actual_architecture, "."
            )
          }

          actual_r_series <- paste(
            R.version$major,
            sub("\\..*$", "", R.version$minor),
            sep = "."
          )
          if (!identical(actual_r_series, Sys.getenv("ASSET_R_SERIES"))) {
            stop(
              "R series mismatch: expected ", Sys.getenv("ASSET_R_SERIES"),
              ", found ", actual_r_series, "."
            )
          }
          if (!identical(.Platform$pkgType, Sys.getenv("EXPECTED_PACKAGE_TYPE"))) {
            stop(
              "Package type mismatch: expected ",
              Sys.getenv("EXPECTED_PACKAGE_TYPE"), ", found ",
              .Platform$pkgType, "."
            )
          }

          metadata <- read.dcf("DESCRIPTION")[1, ]
          version <- unname(metadata[["Version"]])
          package <- unname(metadata[["Package"]])
          tag_version <- sub("^v", "", Sys.getenv("RELEASE_TAG"))
          if (!identical(tag_version, version)) {
            stop("Release tag and DESCRIPTION version do not match.")
          }

          build_library <- tempfile("netop-build-library-")
          dir.create(build_library)
          status <- system2(
            file.path(R.home("bin"), "R"),
            c(
              "CMD", "INSTALL", "--build",
              paste0("--library=", shQuote(build_library)),
              shQuote(Sys.getenv("SOURCE_ASSET"))
            )
          )
          if (!identical(status, 0L)) stop("Binary package build failed.")

          extension <- Sys.getenv("ASSET_EXTENSION")
          built <- sprintf("%s_%s.%s", package, version, extension)
          r_series <- paste(
            R.version$major,
            sub("\\..*$", "", R.version$minor),
            sep = "."
          )
          asset <- sprintf(
            "%s_%s_R-%s_%s.%s",
            package,
            version,
            r_series,
            Sys.getenv("ASSET_ARCHITECTURE"),
            extension
          )
          if (!file.rename(built, asset)) stop("Could not rename binary asset.")
          cat("asset=", asset, "\n", file = Sys.getenv("GITHUB_OUTPUT"),
              sep = "", append = TRUE)
        shell: Rscript {0}
      - name: Verify macOS deployment target
        if: runner.os == 'macOS'
        env:
          BINARY_ASSET: ${{ steps.build.outputs.asset }}
          EXPECTED_MACOS_TARGET: ${{ matrix.macos_target }}
        run: |
          inspection_directory="$(mktemp -d)"
          trap 'rm -rf "$inspection_directory"' EXIT
          tar -xzf "$BINARY_ASSET" -C "$inspection_directory"
          shared_object="$inspection_directory/netOP/libs/netOP.so"
          actual_target="$(
            otool -l "$shared_object" |
              awk '/LC_BUILD_VERSION/{found=1; next} found && $1=="minos"{print $2; exit}'
          )"
          if [[ "$actual_target" != "$EXPECTED_MACOS_TARGET" ]]; then
            echo "Expected macOS target $EXPECTED_MACOS_TARGET; found $actual_target."
            exit 1
          fi
        shell: bash
      - name: Test binary package
        env:
          BINARY_ASSET: ${{ steps.build.outputs.asset }}
        run: |
          metadata <- read.dcf("DESCRIPTION")[1, ]
          version <- unname(metadata[["Version"]])
          extension <- tools::file_ext(Sys.getenv("BINARY_ASSET"))
          installation_asset <- file.path(
            tempdir(),
            sprintf("netOP_%s.%s", version, extension)
          )
          if (!file.copy(Sys.getenv("BINARY_ASSET"), installation_asset)) {
            stop("Could not prepare binary for installation testing.")
          }
          library_path <- tempfile("netop-binary-library-")
          dir.create(library_path)
          install.packages(
            installation_asset,
            repos = NULL,
            type = "binary",
            lib = library_path
          )
          .libPaths(c(library_path, .libPaths()))
          source(".github/scripts/test-installed.R", local = TRUE)
        shell: Rscript {0}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.r_series }}-${{ matrix.architecture }}-${{ matrix.extension }}
          path: ${{ steps.build.outputs.asset }}
          if-no-files-found: error

  source:
    needs: preflight
    outputs:
      asset: ${{ steps.build.outputs.asset }}
    name: Source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          dependencies: '"all"'
      - name: Build source package
        id: build
        run: |
          metadata <- read.dcf("DESCRIPTION")[1, ]
          version <- unname(metadata[["Version"]])
          package <- unname(metadata[["Package"]])
          tag_version <- sub("^v", "", Sys.getenv("RELEASE_TAG"))
          if (!identical(tag_version, version)) {
            stop("Release tag and DESCRIPTION version do not match.")
          }

          status <- system2(
            file.path(R.home("bin"), "R"),
            c("CMD", "build", ".")
          )
          if (!identical(status, 0L)) stop("Source package build failed.")
          asset <- sprintf("%s_%s.tar.gz", package, version)
          if (!file.exists(asset)) stop("Source package asset was not created.")
          cat("asset=", asset, "\n", file = Sys.getenv("GITHUB_OUTPUT"),
              sep = "", append = TRUE)
        shell: Rscript {0}
      - name: Check source package
        env:
          SOURCE_ASSET: ${{ steps.build.outputs.asset }}
        run: |
          rcmdcheck::rcmdcheck(
            Sys.getenv("SOURCE_ASSET"), args = c("--as-cran", "--no-manual"),
            error_on = "warning", check_dir = "check"
          )
        shell: Rscript {0}
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: ${{ steps.build.outputs.asset }}
          if-no-files-found: error

  attach:
    name: Attach complete validated set to draft
    needs: [preflight, source, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete asset set and calculate checksums
        run: python3 .github/scripts/verify-release-assets.py
      - name: Attach assets to the still-empty draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,assets > release.json
          python3 - <<'PYTHON'
          import json
          release = json.load(open("release.json"))
          if not release["isDraft"] or release["assets"]:
              raise SystemExit("The release must remain an empty draft until attachment.")
          PYTHON
          gh release upload "$RELEASE_TAG" release-assets/*
        shell: bash
